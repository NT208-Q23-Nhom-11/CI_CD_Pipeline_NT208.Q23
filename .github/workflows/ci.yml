name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches:
      - develop
      - main
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Record CI start time
        run: echo "CI_START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: flake8 app tests

      - name: Run unit tests
        run: pytest tests/test_unit.py -v

      - name: Run integration tests
        run: pytest tests/test_integration.py -v

      - name: Write CI summary
        if: always()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - CI_START_TIME))
          {
            echo "## CI Summary"
            echo "- Python: 3.11"
            echo "- Lint: flake8 app tests"
            echo "- Unit test: pytest tests/test_unit.py -v"
            echo "- Integration test: pytest tests/test_integration.py -v"
            echo "- Commit: $GITHUB_SHA"
            echo "- Status: ${{ job.status }}"
            echo "- Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      # --- 1. Checkout source ---
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Record audit start time
        run: echo "AUDIT_START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      # --- 2. Setup Python and pip cache ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # --- 3. Install audit tooling ---
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      # --- 4. Run dependency audit ---
      - name: Run dependency audit
        id: pip-audit
        continue-on-error: true
        run: |
          set +e
          pip-audit \
            --requirement requirements.txt \
            --format json \
            --output pip-audit-report.json
          audit_exit=$?
          if [ ! -f pip-audit-report.json ]; then
            printf '{"dependencies":[],"fixes":[]}\n' > pip-audit-report.json
          fi

          pip-audit \
            --requirement requirements.txt \
            --format columns \
            | tee pip-audit-report.txt

          set -e
          echo "exit_code=$audit_exit" >> "$GITHUB_OUTPUT"

          if [ "$audit_exit" -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "::notice::pip-audit did not find known vulnerabilities."
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "::error::pip-audit found known vulnerabilities. Review the audit artifact and Dependabot alerts/PRs."
          fi

          exit "$audit_exit"

      # --- 5. Write summary and audit evidence ---
      - name: Write audit evidence and summary
        if: always()
        run: |
          duration=$(($(date +%s) - AUDIT_START_TIME))
          result="${{ steps.pip-audit.outputs.result }}"
          exit_code="${{ steps.pip-audit.outputs.exit_code }}"
          result="${result:-not-run}"
          exit_code="${exit_code:-unknown}"

          {
            echo "Dependency Audit Evidence"
            echo "========================="
            echo "Timestamp: $(date -Iseconds)"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit SHA: $GITHUB_SHA"
            echo "Python: 3.11"
            echo "Command: pip-audit --requirement requirements.txt"
            echo "Result: $result"
            echo "Exit code: $exit_code"
            echo "Duration: ${duration}s"
          } > dependency-audit-evidence.txt

          {
            echo "## Dependency Audit Summary"
            echo "- Tool: pip-audit"
            echo "- Python: 3.11"
            echo "- Requirement file: requirements.txt"
            echo "- Result: $result"
            echo "- Exit code: $exit_code"
            echo "- Duration: ${duration}s"
            echo "- Remediation: Dependabot is configured in .github/dependabot.yml"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- 6. Auto-remediation is handled by Dependabot ---
      # Dependabot opens dependency update PRs from .github/dependabot.yml.
      # We do not create ad-hoc auto-fix PRs inside the CI workflow.

      # --- 7. Send Discord notification ---
      - name: Send Discord notification
        if: steps.pip-audit.outputs.exit_code != '0' && env.DISCORD_WEBHOOK_URL != ''
        run: |
          python - <<'PY'
          import json
          import os

          report_path = "pip-audit-report.json"
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          short_sha = os.environ["GITHUB_SHA"][:7]

          try:
              with open(report_path, encoding="utf-8") as report_file:
                  report = json.load(report_file)
          except Exception:
              report = {}

          findings = []
          for dependency in report.get("dependencies", []):
              package = dependency.get("name", "unknown")
              version = dependency.get("version", "unknown")
              for vulnerability in dependency.get("vulns", []):
                  aliases = vulnerability.get("aliases") or []
                  cve = next((alias for alias in aliases if alias.startswith("CVE-")), None)
                  cve = cve or vulnerability.get("id", "unknown")
                  fix_versions = vulnerability.get("fix_versions") or []
                  fix = ", ".join(fix_versions) if fix_versions else "No fixed version listed"
                  findings.append((package, version, cve, fix))

          lines = [
              f"🔒 **Security Alert in {os.environ['GITHUB_REPOSITORY']}**",
              "",
              "⚠️ `pip-audit` found known vulnerabilities!",
              "",
          ]

          if findings:
              for package, version, cve, fix in findings[:5]:
                  lines.extend([
                      f"📦 **Package**: `{package}=={version}`",
                      f"🔴 **CVE**: {cve}",
                      f"✅ **Fix**: `{fix}`",
                      "---",
                      "",
                  ])
              if len(findings) > 5:
                  lines.extend([
                      f"...and {len(findings) - 5} more finding(s).",
                      "",
                  ])
          else:
              lines.extend([
                  "📦 Package: See pip-audit artifact",
                  "🔴 CVE: See pip-audit artifact",
                  "✅ Fix: See pip-audit artifact",
                  "---",
                  "",
              ])

          lines.extend([
              "📋 **Details**:",
              f"• Branch: `{os.environ['GITHUB_REF_NAME']}`",
              f"• Commit: `{short_sha}`",
              f"• [View Run on GitHub]({run_url})",
          ])

          discord_payload = {
              "content": "\n".join(lines)
          }

          with open("discord-payload.json", "w", encoding="utf-8") as payload_file:
              json.dump(discord_payload, payload_file)
          PY

          curl -sS -H "Content-Type: application/json" -X POST -d @discord-payload.json "${DISCORD_WEBHOOK_URL}"

      # --- 8. Skip Discord notification ---
      - name: Skip Discord notification
        if: steps.pip-audit.outputs.exit_code != '0' && env.DISCORD_WEBHOOK_URL == ''
        run: |
          echo "::notice::pip-audit failed, but DISCORD_WEBHOOK_URL is not configured. Skipping Discord notification."

      # --- Final gate: fail job after evidence and notification steps ---
      - name: Fail if dependency audit failed
        if: steps.pip-audit.outputs.exit_code != '0'
        run: exit 1

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: "8.24.2"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      # --- 1. Checkout full history for both diff and history scans ---
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 2. Install Gitleaks CLI ---
      - name: Install Gitleaks
        run: |
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      # --- 3. Scan PR/push diff ---
      - name: Resolve diff scan range
        id: scan-range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-list --max-parents=0 "$head_sha")"
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Diff scan range: $base_sha..$head_sha"

      - name: Scan changed commits with Gitleaks
        id: gitleaks-diff
        continue-on-error: true
        run: |
          set +e
          ./gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --log-opts="${{ steps.scan-range.outputs.base_sha }}..${{ steps.scan-range.outputs.head_sha }}" \
            --report-format json \
            --report-path gitleaks-diff-report.json \
            .
          exit_code=$?
          set -e

          if [ ! -f gitleaks-diff-report.json ]; then
            printf '[]\n' > gitleaks-diff-report.json
          fi

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      # --- 4. Scan full repository history ---
      - name: Scan full history with Gitleaks
        id: gitleaks-history
        continue-on-error: true
        run: |
          set +e
          ./gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --report-format json \
            --report-path gitleaks-history-report.json \
            .
          exit_code=$?
          set -e

          if [ ! -f gitleaks-history-report.json ]; then
            printf '[]\n' > gitleaks-history-report.json
          fi

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      # --- 5. Write summary and evidence ---
      - name: Write Gitleaks summary
        if: always()
        run: |
          diff_count="$(python -c "import json; print(len(json.load(open('gitleaks-diff-report.json', encoding='utf-8'))))")"
          history_count="$(python -c "import json; print(len(json.load(open('gitleaks-history-report.json', encoding='utf-8'))))")"

          {
            echo "Gitleaks Secret Scan Evidence"
            echo "============================="
            echo "Timestamp: $(date -Iseconds)"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit SHA: $GITHUB_SHA"
            echo "Diff range: ${{ steps.scan-range.outputs.base_sha }}..${{ steps.scan-range.outputs.head_sha }}"
            echo "Diff findings: $diff_count"
            echo "Full history findings: $history_count"
          } > gitleaks-evidence.txt

          {
            echo "## Gitleaks Secret Scan Summary"
            echo "- Config: .gitleaks.toml"
            echo "- Diff scan range: ${{ steps.scan-range.outputs.base_sha }}..${{ steps.scan-range.outputs.head_sha }}"
            echo "- Diff findings: $diff_count"
            echo "- Full history findings: $history_count"
            echo "- Local prevention: pre-commit config is available in .pre-commit-config.yaml"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- 6. Upload reports ---
      - name: Upload Gitleaks artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-secret-scan-${{ github.run_id }}
          path: |
            gitleaks-diff-report.json
            gitleaks-history-report.json
            gitleaks-evidence.txt
          retention-days: 30
      # --- 7. Send Discord notification ---
      - name: Send Discord notification
        if: (steps.gitleaks-diff.outputs.exit_code != '0' || steps.gitleaks-history.outputs.exit_code != '0') && env.DISCORD_WEBHOOK_URL != ''
        run: |
          python - <<'PY'
          import json
          import os

          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          short_sha = os.environ["GITHUB_SHA"][:7]
          
          # Hàm đọc file report JSON an toàn
          def get_findings(filepath):
              try:
                  with open(filepath, encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return []

          diff_findings = get_findings("gitleaks-diff-report.json")
          history_findings = get_findings("gitleaks-history-report.json")
          
          total_findings = len(diff_findings) + len(history_findings)
          all_findings = diff_findings + history_findings
          
          lines = [
              f"🚨 **Báo Động Bảo Mật trong {os.environ['GITHUB_REPOSITORY']}**",
              "",
              "⚠️ `Gitleaks` phát hiện secret hoặc thông tin nhạy cảm bị rò rỉ trong mã nguồn!",
              "",
              f"🔍 **Tổng số lỗi**: {total_findings} (Diff: {len(diff_findings)}, History: {len(history_findings)})",
              "",
          ]
          
          # Lấy tối đa 3 lỗi đầu tiên để hiển thị ví dụ
          for finding in all_findings[:3]:
              rule = finding.get("RuleID", "unknown")
              file = finding.get("File", "unknown")
              commit = finding.get("Commit", "unknown")[:7]
              lines.extend([
                  f"📄 **File**: `{file}`",
                  f"🔑 **Loại (Rule)**: `{rule}`",
                  f"🏷️ **Commit**: `{commit}`",
                  "---",
                  ""
              ])
          
          if total_findings > 3:
              lines.extend([
                  f"...và {total_findings - 3} lỗi khác. (Vui lòng tải Artifact về để xem chi tiết)",
                  ""
              ])

          lines.extend([
              "📋 **Chi Tiết Run**:",
              f"• Branch: `{os.environ.get('GITHUB_REF_NAME', 'unknown')}`",
              f"• Commit: `{short_sha}`",
              f"• [Xem chi tiết trên GitHub Actions]({run_url})",
          ])

          # Đóng gói thành định dạng embed của Discord cho đẹp
          discord_payload = {
              "embeds": [{
                "title": "Cảnh Báo Rò Rỉ Secret",
                "description": "\n".join(lines),
                "color": 15158332 # Màu đỏ
              }]
          }

          with open("discord-payload.json", "w", encoding="utf-8") as payload_file:
              json.dump(discord_payload, payload_file)
          PY

          curl -sS -H "Content-Type: application/json" -X POST -d @discord-payload.json "${DISCORD_WEBHOOK_URL}"

      # --- Final gate: fail if any secret scan failed ---
      - name: Fail if Gitleaks found secrets
        if: steps.gitleaks-diff.outputs.exit_code != '0' || steps.gitleaks-history.outputs.exit_code != '0'
        run: exit 1
