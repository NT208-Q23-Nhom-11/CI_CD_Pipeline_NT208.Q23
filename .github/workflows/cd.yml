name: CD Pipeline

on:
  push:
    branches: [ develop ] # Trigger khi code được merge vào develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lấy 7 ký tự đầu của commit để làm Image Tag (FR-032)
      - name: Set Image Tag
        run: echo "IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      # Đăng nhập vào GitHub Container Registry (FR-034)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build và Push Image (FR-031)
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository }}:latest

      # Gọi script deploy trên Staging Server (FR-035)
      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            # Di chuyển vào thư mục chứa docker-compose và script trên server
            cd ~/staging
            
            # Cấp quyền chạy cho script (nếu chưa có)
            chmod +x scripts/deploy.sh scripts/rollback.sh
            
            # Chạy deploy. Truyền các tham số cần thiết vào
            ./scripts/deploy.sh ${{ env.IMAGE_TAG }} ${{ github.repository }} ${{ github.actor }} "${{ secrets.GITHUB_TOKEN }}"
