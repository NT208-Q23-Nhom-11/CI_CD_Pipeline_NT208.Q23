name: CD Pipeline

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.11"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      registry_image: ${{ steps.image-meta.outputs.registry_image }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Record CD build start time
        run: echo "CD_BUILD_START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Resolve GHCR image name
        id: image-meta
        run: |
          registry_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "registry_image=$registry_image" >> "$GITHUB_OUTPUT"
          echo "REGISTRY_IMAGE=$registry_image" >> "$GITHUB_ENV"
          echo "Image: $registry_image"
          echo "Tag: $IMAGE_TAG"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull latest image for build cache
        run: docker pull "$REGISTRY_IMAGE:latest" || true

      - name: Build Docker image
        run: |
          docker build \
            --cache-from "$REGISTRY_IMAGE:latest" \
            -t "$REGISTRY_IMAGE:$IMAGE_TAG" \
            -t "$REGISTRY_IMAGE:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "$REGISTRY_IMAGE:$IMAGE_TAG"
          docker push "$REGISTRY_IMAGE:latest"

      - name: Write build summary
        if: always()
        run: |
          duration=$(($(date +%s) - CD_BUILD_START_TIME))
          {
            echo "## CD Build Summary"
            echo "- Image: $REGISTRY_IMAGE"
            echo "- SHA tag: $IMAGE_TAG"
            echo "- Latest tag: latest"
            echo "- Status: ${{ job.status }}"
            echo "- Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-and-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      REGISTRY_IMAGE: ${{ needs.build-and-push.outputs.registry_image }}

    steps:
      - name: Record CD deploy start time
        run: echo "CD_DEPLOY_START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Deploy, smoke test, and rollback if needed
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_IMAGE_TAG: ${{ github.sha }}
          DEPLOY_REGISTRY_IMAGE: ${{ needs.build-and-push.outputs.registry_image }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          # Nạp thêm biến Webhook URL vào môi trường chạy CD
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          envs: DEPLOY_IMAGE_TAG,DEPLOY_REGISTRY_IMAGE,GHCR_READ_TOKEN,GHCR_USERNAME,DISCORD_WEBHOOK_URL
          script: |
            set -euo pipefail

            REPO_DIR="${REPO_DIR:-CI_CD_Pipeline_NT208.Q23}"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            IMAGE_TAG="$DEPLOY_IMAGE_TAG"
            REGISTRY_IMAGE="$DEPLOY_REGISTRY_IMAGE"

            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git fetch origin develop
            git reset --hard origin/develop

            chmod +x scripts/deploy.sh scripts/rollback.sh scripts/smoke_test.sh

            if [ -n "${GHCR_READ_TOKEN:-}" ]; then
              echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            else
              echo "[CD] GHCR_READ_TOKEN is not configured; using existing Docker auth or public package access."
            fi

            export REGISTRY_IMAGE
            bash scripts/deploy.sh "$IMAGE_TAG"

            # --- KIỂM TRA SMOKE TEST ---
            if bash scripts/smoke_test.sh http://localhost:5000/health; then
              echo "[CD] Deploy smoke test passed."
              
              # 1. THÔNG BÁO DEPLOY THÀNH CÔNG (THẺ CÓ VIỀN XANH LÁ)
              if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
                curl -sS -H "Content-Type: application/json" -X POST -d '{
                  "embeds": [{
                    "title": "Triển Khai Thành Công (Staging)",
                    "description": "Phiên bản mới đã vượt qua bài kiểm tra sức khỏe (smoke test) và đang hoạt động ổn định trên máy chủ Azure.",
                    "color": 3066993,
                    "fields": [
                      {"name": "Phiên bản (Tag)", "value": "`'"${IMAGE_TAG:0:7}"'`", "inline": true},
                      {"name": "Kích hoạt bởi", "value": "`'"${GHCR_USERNAME}"'`", "inline": true}
                    ]
                  }]
                }' "$DISCORD_WEBHOOK_URL"
              fi
              
              exit 0
            fi

            echo "[CD] Deploy smoke test failed. Starting rollback..."
            
            # 2. CẢNH BÁO LỖI & ROLLBACK (THẺ CÓ VIỀN ĐỎ)
            if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
              curl -sS -H "Content-Type: application/json" -X POST -d '{
                "embeds": [{
                  "title": "Cảnh Báo Kiểm Thử Thất Bại",
                  "description": "Phiên bản mới không qua được smoke test! Luồng CI/CD đang tự động ngắt kết nối và kích hoạt tiến trình **Rollback** khẩn cấp...",
                  "color": 15158332,
                  "fields": [
                    {"name": "Tag Bị Lỗi", "value": "`'"${IMAGE_TAG:0:7}"'`", "inline": true}
                  ]
                }]
              }' "$DISCORD_WEBHOOK_URL"
            fi

            bash scripts/rollback.sh

            echo "[CD] Running post-rollback smoke test..."
            bash scripts/smoke_test.sh http://localhost:5000/health
            echo "[CD] Rollback recovered: health check is OK."
            
            # 3. THÔNG BÁO ROLLBACK THÀNH CÔNG (THẺ CÓ VIỀN VÀNG CAM)
            if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
              curl -sS -H "Content-Type: application/json" -X POST -d '{
                "embeds": [{
                  "title": "Phục Hồi Hệ Thống Hoàn Tất",
                  "description": "Quá trình tự động Rollback đã xử lý xong. Hệ thống đã gỡ bỏ bản lỗi và an toàn quay về phiên bản ổn định trước đó.",
                  "color": 16753920
                }]
              }' "$DISCORD_WEBHOOK_URL"
            fi

      - name: Write deploy summary
        if: always()
        run: |
          duration=$(($(date +%s) - CD_DEPLOY_START_TIME))
          {
            echo "## CD Deploy Summary"
            echo "- Image: $REGISTRY_IMAGE"
            echo "- SHA tag: $IMAGE_TAG"
            echo "- Deploy target: staging"
            echo "- Smoke test: see deploy step logs"
            echo "- Rollback: triggered automatically if smoke test fails"
            echo "- Status: ${{ job.status }}"
            echo "- Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
