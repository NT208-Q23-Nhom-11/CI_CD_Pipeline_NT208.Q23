title = "CI/CD Pipeline NT208 Gitleaks Config"

[extend]
useDefault = true

[[rules]]
id = "flask-secret-key-assignment"
description = "Hardcoded Flask SECRET_KEY value"
regex = '''(?i)(SECRET_KEY|FLASK_SECRET_KEY)\s*[:=]\s*['"]([^'"]{16,})['"]'''
secretGroup = 2
entropy = 3.0
keywords = ["SECRET_KEY", "FLASK_SECRET_KEY"]
tags = ["flask", "secret", "python"]

[[rules]]
id = "dotenv-sensitive-assignment"
description = "Sensitive value committed in dotenv-style assignment"
regex = '''(?i)(password|passwd|pwd|token|api[_-]?key|secret|private[_-]?key)\s*=\s*['"]?([^'"\s#]{12,})'''
secretGroup = 2
entropy = 3.0
keywords = ["password", "token", "secret", "api_key", "private_key"]
tags = ["dotenv", "secret"]

[allowlist]
description = "Project placeholders, known demo secret, and generated scan artifacts"
regexTarget = "line"
regexes = [
  '''change-this-in-github-secrets''',
  '''change-me-only-for-local''',
  '''change-me''',
  '''<full_commit_sha_or_image_tag>''',
  '''\$\{\{\s*secrets\.[A-Z0-9_]+\s*\}\}''',
  '''STAGING_SSH_KEY''',
  '''STAGING_HOST''',
  '''STAGING_USER''',
  '''STAGING_SSH_PORT''',
  '''GHCR_READ_TOKEN''',
  '''DISCORD_WEBHOOK_URL''',
  '''SECRET_KEY\s*=\s*"day_la_chuoi_bi_mat_khong_duoc_lo_ra_ngoai_12345"''',
]
commits = [
  '''79489d54fd0309339e697cb8fb9be2cb7985bcd7''',
  '''95396a393c5ec647f8fc227b7166b063441542b5''',
]
paths = [
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)\.pytest_cache/.*''',
  '''(^|/)htmlcov/.*''',
  '''(^|/)gitleaks-.*\.json$''',
  '''(^|/)gitleaks-.*\.txt$''',
]
